# ==============================================================================
# HeroCMS Full-Stack Infrastructure with Traefik Edge Routing (Zero Nginx)
# Services: 02-dashboard-cms & 04-marketing-site + PostgreSQL 16 + Redis 7
#
# Domain Production:
#   - Marketing Site : http://herocms.stackbyte.id
#   - Studio CMS     : http://studio.herocms.stackbyte.id
#
# Networks:
#   - app-network     : Bridge internal network untuk service HeroCMS
#   - redis-net       : External network (redis-net-local) untuk integrasi Redis
#   - traefik_network : External network untuk membaca Traefik labels & routing
#
# Pastikan external network sudah siap sebelum up:
#   docker network create traefik_network 2>/dev/null || true
#   docker network create redis-net-local 2>/dev/null || true
#
# Jalankan Demo:
#   docker compose up --build -d
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 Multi-Tenant dengan Row-Level Security (RLS)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: herocms_postgres
    restart: unless-stopped
    networks:
      - app-network
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cloudcms_db}
      POSTGRES_USER: ${DB_USERNAME:-cloudcms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/sql/01_schema_and_rls.sql:/docker-entrypoint-initdb.d/01_schema_and_rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cloudcms_user} -d ${DB_DATABASE:-cloudcms_db}"]
      interval: 4s
      timeout: 4s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Redis 7 (Cache, Session State, Rate Limiting & Top-Views Stream)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: herocms_redis
    restart: unless-stopped
    networks:
      - app-network
      - redis-net
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secret_redis_password}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret_redis_password}", "ping"]
      interval: 4s
      timeout: 4s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Service 02: Dashboard CMS Studio (Native Golang Host + Vue 3 SPA)
  # ---------------------------------------------------------------------------
  dashboard-cms:
    build:
      context: ./services/02-dashboard-cms
      dockerfile: Dockerfile
    container_name: herocms_dashboard_cms
    restart: unless-stopped
    networks:
      - app-network
      - redis-net
      - traefik_network
    environment:
      PORT: 8085
      DIST_DIR: /app/dist
      GIN_MODE: release
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-cloudcms_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_postgres_password}
      DB_DATABASE: ${DB_DATABASE:-cloudcms_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret_redis_password}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_herocms_enterprise_production_2026}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.herocms-studio.rule=Host(`studio-herocms.stackbyte.id`) || Host(`studio.herocms.stackbyte.id`)"
      - "traefik.http.routers.herocms-studio.entrypoints=web"
      - "traefik.http.routers.herocms-studio.middlewares=security-headers@file,gzip-compress@file"
      - "traefik.http.routers.herocms-studio.service=herocms-studio-svc"
      - "traefik.http.services.herocms-studio-svc.loadbalancer.server.port=8085"

  # ---------------------------------------------------------------------------
  # 4. Service 04: Marketing Landing Site (Native Golang Host + React SPA)
  # ---------------------------------------------------------------------------
  marketing-site:
    build:
      context: ./services/04-marketing-site
      dockerfile: Dockerfile
    container_name: herocms_marketing_site
    restart: unless-stopped
    networks:
      - app-network
      - traefik_network
    environment:
      PORT: 80
      DIST_DIR: /app/dist
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.herocms-marketing.rule=Host(`herocms.stackbyte.id`)"
      - "traefik.http.routers.herocms-marketing.entrypoints=web"
      - "traefik.http.routers.herocms-marketing.middlewares=security-headers@file,gzip-compress@file"
      - "traefik.http.routers.herocms-marketing.service=herocms-marketing-svc"
      - "traefik.http.services.herocms-marketing-svc.loadbalancer.server.port=80"

volumes:
  postgres_data:
    name: herocms_postgres_data
  redis_data:
    name: herocms_redis_data

networks:
  app-network:
    driver: bridge

  redis-net:
    external: true
    name: redis-net-local

  traefik_network:
    external: true
