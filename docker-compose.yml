# ==============================================================================
# HeroCMS Unified Master Infrastructure & Application Stack (Single Source of Truth)
#
# Seluruh komponen platform dapat dijalankan dengan satu perintah tunggal:
#   docker compose up -d
#
# Arsitektur Layanan Terpadu:
#   1. Ingress & Security   : Traefik v3 (Let's Encrypt SSL) + Cloudflare Tunnel (cloudflared)
#   2. Control Plane        : Service 03 (Provision Orchestrator - Headless Go Daemon)
#   3. Data & Storage       : PostgreSQL 16 (RLS) + Redis 7 + Redpanda (Kafka API) + MinIO S3
#   4. Web Applications     : Service 02 (Studio CMS) + Service 04 (Marketing) + Service 07 (Docs)
#   5. Workflow Automation  : n8n Workflow & Webhook Engine
#
# Jaringan Terpadu (Dibuat otomatis oleh Docker Compose tanpa perlu network create manual):
#   - herocms_edge_net     : Jaringan perutean Traefik, cloudflared, dan web services publik
#   - herocms_internal_net : Jaringan terisolasi untuk database, Redis, Kafka, dan Orchestrator
# ==============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Edge Ingress Gateway & Reverse Proxy (Traefik v3 + ACME Let's Encrypt)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: herocms_traefik
    restart: always
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=herocms_edge_net"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # ACME Let's Encrypt Automatic TLS Configuration
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@herocms.stackbyte.id}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Web UI Console (protected / internal)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/acme.json:/acme.json
      - ./deploy/traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - herocms_edge_net
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # 2. Cloudflare Tunnel (cloudflared - Outbound Zero-Open-Port Ingress)
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: herocms_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - herocms_edge_net
    depends_on:
      traefik:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 3. Service 03: Provision Orchestrator (Headless Golang Control Plane)
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: ./services/03-provision-orchestrator
      dockerfile: Dockerfile
    image: roxas0800/herocms-orchestrator:latest
    container_name: herocms_provision_orchestrator
    restart: unless-stopped
    environment:
      PORT: 8080
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_EDGE_NETWORK: herocms_edge_net
      TENANT_RUNTIME_IMAGE: ${TENANT_RUNTIME_IMAGE:-roxas0800/tenant-runtime:alpine-v1}
      TENANT_STORAGE_BASE: /var/lib/herocms/tenants
      INTERNAL_SECRET_TOKEN: ${INTERNAL_SECRET_TOKEN:-herocms_internal_secret_key_v1}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret_redis_password}
      KAFKA_BROKERS: redpanda:9092
      REQUIRE_INTERNAL_AUTH: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tenant_storage:/var/lib/herocms/tenants
    expose:
      - "8080" # Strict Local-Only (Direct hit internal dari CMS, zero open port)
    networks:
      - herocms_internal_net
      - herocms_edge_net
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started

  # ---------------------------------------------------------------------------
  # 4. Primary Multi-Tenant Database (PostgreSQL 16 with Row-Level Security RLS)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: herocms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cloudcms_db}
      POSTGRES_USER: ${DB_USERNAME:-cloudcms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_postgres_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/sql/01_schema_and_rls.sql:/docker-entrypoint-initdb.d/01_schema_and_rls.sql:ro
    networks:
      - herocms_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cloudcms_user} -d ${DB_DATABASE:-cloudcms_db}"]
      interval: 4s
      timeout: 4s
      retries: 5

  # ---------------------------------------------------------------------------
  # 5. Distributed Cache, Mutex Lock & Rate Limiting (Redis 7)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: herocms_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secret_redis_password}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - herocms_internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret_redis_password}", "ping"]
      interval: 4s
      timeout: 4s
      retries: 5

  # ---------------------------------------------------------------------------
  # 6. High-Throughput Event Streaming Bus (Redpanda - Kafka API Compatible)
  # ---------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: herocms_redpanda
    restart: always
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "${KAFKA_EXTERNAL_PORT:-19092}:19092"
      - "9644:9644" # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - herocms_internal_net

  # ---------------------------------------------------------------------------
  # 7. MinIO S3 Object Storage (Asset Segregation & Media Storage)
  # ---------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: herocms_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-secret_minio_password}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - herocms_internal_net
      - herocms_edge_net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=herocms_edge_net"
      - "traefik.http.routers.herocms-minio.rule=Host(`minio.stackbyte.id`)"
      - "traefik.http.routers.herocms-minio.entrypoints=web"
      - "traefik.http.services.herocms-minio-svc.loadbalancer.server.port=9000"

  # ---------------------------------------------------------------------------
  # 8. Service 02: Dashboard CMS Studio (Native Golang Host + Vue 3 SPA)
  # ---------------------------------------------------------------------------
  dashboard-cms:
    image: roxas0800/herocms-dashboard:latest
    build:
      context: ./services/02-dashboard-cms
      dockerfile: Dockerfile
    container_name: herocms_dashboard_cms
    restart: unless-stopped
    networks:
      - herocms_internal_net
      - herocms_edge_net
    environment:
      PORT: 8085
      DIST_DIR: /app/dist
      GIN_MODE: release
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-cloudcms_user}
      DB_PASSWORD: ${DB_PASSWORD:-secret_postgres_password}
      DB_DATABASE: ${DB_DATABASE:-cloudcms_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret_redis_password}
      ORCHESTRATOR_URL: http://orchestrator:8080
      INTERNAL_SECRET_TOKEN: ${INTERNAL_SECRET_TOKEN:-herocms_internal_secret_key_v1}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_herocms_enterprise_production_2026}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-secret_minio_password}
      S3_BUCKET: ${S3_BUCKET:-herocms-media}
      S3_USE_SSL: "false"
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://minio.stackbyte.id}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      orchestrator:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=herocms_edge_net"
      - "traefik.http.routers.herocms-studio.rule=Host(`studio-herocms.stackbyte.id`) || Host(`studio.herocms.stackbyte.id`)"
      - "traefik.http.routers.herocms-studio.entrypoints=web"
      - "traefik.http.routers.herocms-studio.middlewares=security-headers@file,gzip-compress@file"
      - "traefik.http.routers.herocms-studio.service=herocms-studio-svc"
      - "traefik.http.services.herocms-studio-svc.loadbalancer.server.port=8085"

  # ---------------------------------------------------------------------------
  # 9. Service 04: Marketing Landing Site (Native Golang Host + React SPA)
  # ---------------------------------------------------------------------------
  marketing-site:
    image: roxas0800/herocms-marketing:latest
    build:
      context: ./services/04-marketing-site
      dockerfile: Dockerfile
    container_name: herocms_marketing_site
    restart: unless-stopped
    networks:
      - herocms_internal_net
      - herocms_edge_net
    environment:
      PORT: 80
      DIST_DIR: /app/dist
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=herocms_edge_net"
      - "traefik.http.routers.herocms-marketing.rule=Host(`herocms.stackbyte.id`)"
      - "traefik.http.routers.herocms-marketing.entrypoints=web"
      - "traefik.http.routers.herocms-marketing.middlewares=security-headers@file,gzip-compress@file"
      - "traefik.http.routers.herocms-marketing.service=herocms-marketing-svc"
      - "traefik.http.services.herocms-marketing-svc.loadbalancer.server.port=80"

  # ---------------------------------------------------------------------------
  # 10. Service 07: Docs & Mission Control Hub (Native Golang Host + Vue 3 SPA)
  # ---------------------------------------------------------------------------
  docs:
    image: roxas0800/herocms-docs:latest
    build:
      context: ./services/07-docs
      dockerfile: Dockerfile
    container_name: herocms_docs
    restart: unless-stopped
    networks:
      - herocms_internal_net
      - herocms_edge_net
    environment:
      PORT: 8087
      DIST_DIR: /app/dist
    ports:
      - "${DOCS_PORT:-8087}:8087"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=herocms_edge_net"
      - "traefik.http.routers.herocms-docs.rule=Host(`docs-herocms.stackbyte.id`) || Host(`docs.localhost`)"
      - "traefik.http.routers.herocms-docs.entrypoints=web"
      - "traefik.http.routers.herocms-docs.middlewares=security-headers@file,gzip-compress@file"
      - "traefik.http.routers.herocms-docs.service=herocms-docs-svc"
      - "traefik.http.services.herocms-docs-svc.loadbalancer.server.port=8087"

  # ---------------------------------------------------------------------------
  # 11. Workflow & Social Automation Engine (n8n)
  # ---------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: herocms_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-adminpassword}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - herocms_internal_net

networks:
  herocms_edge_net:
    name: herocms_edge_net
    driver: bridge
  herocms_internal_net:
    name: herocms_internal_net
    driver: bridge

volumes:
  postgres_data:
    name: herocms_postgres_data
  redis_data:
    name: herocms_redis_data
  redpanda_data:
    name: herocms_redpanda_data
  minio_data:
    name: herocms_minio_data
  n8n_data:
    name: herocms_n8n_data
  tenant_storage:
    name: herocms_tenant_storage
