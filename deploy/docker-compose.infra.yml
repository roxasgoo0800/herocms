# ==============================================================================
# HeroCMS Master Infrastructure Stack
# Components:
#   1. Traefik v3 (Edge Ingress Gateway & Dynamic Routing)
#   2. ACME Let's Encrypt (Automated SSL/TLS Certificates)
#   3. Cloudflare Tunnel (cloudflared - Outbound Zero-Open-Port Ingress)
#   4. Service 03: Provision Orchestrator (Autonomous Headless Go Control Plane)
#   5. Redpanda (Kafka API-Compatible High-Throughput Event Streaming)
#   6. Redis 7 (Distributed Mutex Locking, State Cache, Top-Views)
#   7. PostgreSQL 16 (Multi-Tenant with Row-Level Security RLS)
#   8. MinIO S3 (Media Storage & Assets CDN)
#   9. n8n (Workflow & Webhook Automation)
#
# Networks:
#   - cloudcms_edge_network : Ingress network for Traefik, cloudflared, and tenant pods
#   - cloudcms_internal_net : Isolated network for databases, Redis, Kafka, and Service 03
# ==============================================================================

version: '3.9'

services:
  # ---------------------------------------------------------------------------
  # 1. Edge Ingress & Reverse Proxy (Traefik v3 + ACME Let's Encrypt)
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: cloudcms_traefik
    restart: always
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=cloudcms_edge_network"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # ACME Let's Encrypt Automatic TLS Configuration
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@herocms.stackbyte.id}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik Web UI Console (protected / internal)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/acme.json
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - cloudcms_edge_network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # 2. Cloudflare Tunnel (cloudflared - Zero Inbound Open Ports)
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudcms_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - cloudcms_edge_network
    depends_on:
      traefik:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 3. Service 03: Provision Orchestrator (Headless Golang Control Plane)
  # ---------------------------------------------------------------------------
  orchestrator:
    build:
      context: ../services/03-provision-orchestrator
      dockerfile: Dockerfile
    image: cloudcms/provision-orchestrator:latest
    container_name: cloudcms_provision_orchestrator
    restart: unless-stopped
    environment:
      PORT: 8080
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_EDGE_NETWORK: cloudcms_edge_network
      TENANT_RUNTIME_IMAGE: ${TENANT_RUNTIME_IMAGE:-cloudcms-tenant-runtime:alpine-v1}
      TENANT_STORAGE_BASE: /var/lib/herocms/tenants
      INTERNAL_SECRET_TOKEN: ${INTERNAL_SECRET_TOKEN:-herocms_internal_secret_key_v1}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret_redis_password}
      KAFKA_BROKERS: redpanda:9092
      REQUIRE_INTERNAL_AUTH: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tenant_storage:/var/lib/herocms/tenants
    expose:
      - "8080" # Strict Local-Only (Direct internal hit from CMS, zero open port)
    networks:
      - cloudcms_internal_net
      - cloudcms_edge_network
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_started

  # ---------------------------------------------------------------------------
  # 4. High-Throughput Event Streaming Bus (Redpanda - Kafka API Compatible)
  # ---------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: cloudcms_redpanda
    restart: always
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "${KAFKA_EXTERNAL_PORT:-19092}:19092"
      - "9644:9644" # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - cloudcms_internal_net

  # ---------------------------------------------------------------------------
  # 5. Distributed Cache & Mutex Lock Engine (Redis 7)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: cloudcms_redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secret_redis_password}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - cloudcms_internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secret_redis_password}", "ping"]
      interval: 4s
      timeout: 4s
      retries: 5

  # ---------------------------------------------------------------------------
  # 6. Primary Multi-Tenant Database (PostgreSQL 16 Multi-Tenant RLS)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cloudcms_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-cloudcms_db}
      POSTGRES_USER: ${DB_USERNAME:-cloudcms_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_postgres_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_schema_and_rls.sql:/docker-entrypoint-initdb.d/01_schema_and_rls.sql:ro
    networks:
      - cloudcms_internal_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-cloudcms_user} -d ${DB_DATABASE:-cloudcms_db}"]
      interval: 4s
      timeout: 4s
      retries: 5

  # ---------------------------------------------------------------------------
  # 7. Object Storage for Media & Content Assets (MinIO S3)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: cloudcms_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-secret_minio_password}
    ports:
      - "${S3_PORT:-9000}:9000" # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web Console
    volumes:
      - minio_data:/data
    networks:
      - cloudcms_internal_net
      - cloudcms_edge_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=cloudcms_edge_network"
      - "traefik.http.routers.minio-s3.rule=Host(`minio.stackbyte.id`)"
      - "traefik.http.routers.minio-s3.entrypoints=web"
      - "traefik.http.services.minio-s3.loadbalancer.server.port=9000"

  # ---------------------------------------------------------------------------
  # 8. Workflow & Social Automation Engine (n8n)
  # ---------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: cloudcms_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-adminpassword}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - cloudcms_internal_net

networks:
  cloudcms_edge_network:
    name: cloudcms_edge_network
    driver: bridge
  cloudcms_internal_net:
    name: cloudcms_internal_net
    driver: bridge

volumes:
  postgres_data:
    name: cloudcms_postgres_data
  redis_data:
    name: cloudcms_redis_data
  redpanda_data:
    name: cloudcms_redpanda_data
  minio_data:
    name: cloudcms_minio_data
  n8n_data:
    name: cloudcms_n8n_data
  tenant_storage:
    name: cloudcms_tenant_storage
