name: Docker Image Release CI/CD

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.8.2). Leave blank to auto-detect from changelog.'
        required: false
        default: ''

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: dashboard-cms
            context: ./services/02-dashboard-cms
            image: roxas0800/herocms-dashboard
          - name: marketing-site
            context: ./services/04-marketing-site
            image: roxas0800/herocms-marketing
          - name: docs-hub
            context: ./services/07-docs
            image: roxas0800/herocms-docs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Release Version
        id: ver
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG=$(grep -oE "version: 'v[0-9]+\.[0-9]+\.[0-9]+'" services/02-dashboard-cms/src/data/changelog.ts | head -n 1 | cut -d "'" -f 2)
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi
          CLEAN_TAG="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_tag=${CLEAN_TAG}" >> $GITHUB_OUTPUT
          echo "Resolved Release Tag: ${TAG} (Clean: ${CLEAN_TAG})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=${{ steps.ver.outputs.clean_tag }}
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
