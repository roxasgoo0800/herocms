name: HeroCMS Docker Image Release CI/CD

# ==============================================================================
# KEBIJAKAN UTAMA RELEASE:
# Pembuatan dan pengunggahan Docker Image ke Docker Hub HANYA BISA DAN HANYA BOLEH
# terjadi saat event GitHub Release dipublikasikan (types: [published]).
# DILARANG KERAS memicu Docker build & push pada event push branch (main, feat, dll).
# ==============================================================================

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to build (e.g. 07-docs-v1.4.1, 02-dashboard-v1.14.28, or v1.15.0)'
        required: true
        default: ''

jobs:
  resolve-targets:
    name: Resolve Target Service & Version
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      target_service: ${{ steps.resolve.outputs.target_service }}
      resolved_version: ${{ steps.resolve.outputs.resolved_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse Release Tag
        id: resolve
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            RAW_TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            RAW_TAG="${{ inputs.release_tag }}"
          else
            echo "Error: No release tag found!"
            exit 1
          fi

          echo "Received Release Tag: ${RAW_TAG}"

          # Extract version portion (remove prefix up to 'v')
          VERSION=$(echo "${RAW_TAG}" | sed -E 's/.*-v//; s/^v//')
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
          fi

          echo "Parsed Version: ${VERSION}"

          # Detect target service based on tag prefix
          case "${RAW_TAG}" in
            07-docs-*|docs-*)
              TARGET="docs"
              MATRIX_JSON='[{"name":"docs-hub","context":"./services/07-docs","image":"roxas0800/herocms-docs","test_dir":"services/07-docs","version":"'${VERSION}'"}]'
              ;;
            02-dashboard-*|dashboard-*)
              TARGET="dashboard"
              MATRIX_JSON='[{"name":"dashboard-cms","context":"./services/02-dashboard-cms","image":"roxas0800/herocms-dashboard","test_dir":"services/02-dashboard-cms","version":"'${VERSION}'"}]'
              ;;
            04-marketing-*|marketing-*)
              TARGET="marketing"
              MATRIX_JSON='[{"name":"marketing-site","context":"./services/04-marketing-site","image":"roxas0800/herocms-marketing","test_dir":"services/04-marketing-site","version":"'${VERSION}'"}]'
              ;;
            03-orchestrator-*|orchestrator-*)
              TARGET="orchestrator"
              MATRIX_JSON='[{"name":"provision-orchestrator","context":"./services/03-provision-orchestrator","image":"roxas0800/herocms-orchestrator","test_dir":"services/03-provision-orchestrator","version":"'${VERSION}'"}]'
              ;;
            05-ai-agent-*|ai-agent-*)
              TARGET="ai-agent"
              MATRIX_JSON='[{"name":"ai-agent-service","context":"./services/05-ai-agent-service","image":"roxas0800/herocms-ai-agent","test_dir":"services/05-ai-agent-service","version":"'${VERSION}'"}]'
              ;;
            v*)
              # Global Platform Suite Tag (e.g. v1.15.0) -> Build active web & orchestrator services
              TARGET="all"
              MATRIX_JSON='[
                {"name":"dashboard-cms","context":"./services/02-dashboard-cms","image":"roxas0800/herocms-dashboard","test_dir":"services/02-dashboard-cms","version":"'${VERSION}'"},
                {"name":"marketing-site","context":"./services/04-marketing-site","image":"roxas0800/herocms-marketing","test_dir":"services/04-marketing-site","version":"'${VERSION}'"},
                {"name":"docs-hub","context":"./services/07-docs","image":"roxas0800/herocms-docs","test_dir":"services/07-docs","version":"'${VERSION}'"}
              ]'
              ;;
            *)
              echo "Warning: Unrecognized tag prefix, fallback to docs-hub"
              TARGET="custom"
              MATRIX_JSON='[{"name":"docs-hub","context":"./services/07-docs","image":"roxas0800/herocms-docs","test_dir":"services/07-docs","version":"'${VERSION}'"}]'
              ;;
          esac

          echo "target_service=${TARGET}" >> $GITHUB_OUTPUT
          echo "resolved_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "matrix={\"include\":${MATRIX_JSON}}" >> $GITHUB_OUTPUT
          echo "Build Targets Matrix: {\"include\":${MATRIX_JSON}}"

  build-and-push:
    name: Build & Push (${{ matrix.name }})
    needs: resolve-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-targets.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22 (for Pentest / Verification)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Pentest Suite for Target Service
        run: |
          if [ -d "${{ matrix.test_dir }}/pentest" ]; then
            echo "Running pentest suite in ${{ matrix.test_dir }}..."
            cd ${{ matrix.test_dir }}
            go test -v ./pentest/... || echo "[WARNING] Pentest completed with skip/warning"
          else
            echo "No pentest directory found in ${{ matrix.test_dir }}, continuing..."
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value=${{ matrix.version }}
            type=raw,value=v${{ matrix.version }}
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
