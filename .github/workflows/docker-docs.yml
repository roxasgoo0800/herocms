name: HeroCMS Docs & Mission Control Hub - Docker CI/CD

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
    paths:
      - 'services/07-docs/**'
      - '.github/workflows/docker-docs.yml'
  pull_request:
    paths:
      - 'services/07-docs/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom tag for Docker image (e.g. v1.15.0). Leave blank to auto-detect from changelog.'
        required: false
        default: ''

jobs:
  test-and-publish:
    name: Test & Push Docker Image (herocms-docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: services/07-docs/go.mod

      - name: Run Pentest & Unit Tests
        run: |
          cd services/07-docs
          go test -v ./pentest/...
          go test -v ./internal/db/...

      - name: Resolve Release Tag
        id: ver
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(grep -oE "version: 'v[0-9]+\.[0-9]+\.[0-9]+'" services/02-dashboard-cms/src/data/changelog.ts | head -n 1 | cut -d "'" -f 2)
          fi
          if [ -z "$TAG" ]; then
            TAG="v1.15.0"
          fi
          CLEAN_TAG="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "clean_tag=${CLEAN_TAG}" >> $GITHUB_OUTPUT
          echo "Resolved Docker Tag: ${TAG} (Clean: ${CLEAN_TAG})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: roxas0800/herocms-docs
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value=${{ steps.ver.outputs.tag }}
            type=raw,value=${{ steps.ver.outputs.clean_tag }}
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/07-docs
          file: ./services/07-docs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
